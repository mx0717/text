<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한국사 풀이</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeToggle" type="button">다크모드</button>

  <div id="loadingOverlay" class="hidden">
    <div class="spinner"></div>
    <p id="loadingText">불러오는 중...</p>
  </div>

  <!-- 홈 화면: 문제지 추가 + 저장된 문제지 목록 -->
  <section id="homeSection">
    <section id="uploadSection">
      <div>
        <label>문제지 PDF: <input type="file" id="examFile" accept="application/pdf"></label>
      </div>
      <div>
        <label>정답지 PDF: <input type="file" id="answerFile" accept="application/pdf"></label>
      </div>
      <div>
        <label>문항 수: <input type="number" id="questionCount" value="50" min="1" max="100"></label>
      </div>
      <div id="modeSelectRow">
        <label class="modeOption">
          <input type="radio" name="examMode" value="free" checked>
          <span class="modeOptionTitle">자유문제 풀이</span>
          <span class="modeOptionDesc">문항을 자유롭게 선택해서 풀고, 답을 고르면 바로 정답/오답을 확인해요.</span>
        </label>
        <label class="modeOption">
          <input type="radio" name="examMode" value="test">
          <span class="modeOptionTitle">시험방식 문제 풀이</span>
          <span class="modeOptionDesc">순서대로만 풀 수 있고, 정답은 모든 문제를 제출한 뒤에 한 번에 확인해요.</span>
        </label>
      </div>
      <div id="loadBtnRow">
        <button id="loadBtn">문제지 추가</button>
      </div>
      <p id="loadStatus"></p>
    </section>

    <div id="examList"></div>
  </section>

  <!-- 풀이 화면 -->
  <section id="solveSection" style="display:none;">
    <div id="backRow">
      <button id="backToListBtn" type="button">← 목록으로</button>
    </div>

    <section id="mainSection">
      <div id="controlRow">
        <div id="controlButtons">
          <button id="resetProgressBtn" type="button">푼 문제 초기화</button>
          <button id="deleteExamBtn" type="button">이 문제지 삭제</button>
        </div>
      </div>

      <div id="workArea">
        <div id="examPanel">
          <div id="examToolbar">
            <button id="zoomOutBtn" type="button">－</button>
            <span id="zoomLevelLabel">100%</span>
            <button id="zoomInBtn" type="button">＋</button>
          </div>
          <div id="examPagesScroll">
            <div id="examPages"></div>
          </div>
        </div>

        <div id="solvePanel">
          <div id="liveScore">맞은 개수: 0 / 0</div>
          <div id="navigator"></div>
          <div id="currentQLabel"></div>
          <div id="bigButtons">
            <button class="choiceBtn" data-choice="1">1</button>
            <button class="choiceBtn" data-choice="2">2</button>
            <button class="choiceBtn" data-choice="3">3</button>
            <button class="choiceBtn" data-choice="4">4</button>
            <button class="choiceBtn" data-choice="5">5</button>
          </div>
          <div id="feedback"></div>
          <button id="submitTestBtn" type="button" style="display:none;">제출하고 채점하기</button>
          <div id="navButtons">
            <button id="prevBtn">← 이전 문제</button>
            <button id="nextBtn">다음 문제 →</button>
          </div>
        </div>
      </div>
    </section>

    <section id="keySection">
      <div id="keyHeaderRow">
        <p id="keyStatus"></p>
        <button id="hideKeyBtn" type="button">정답 가리기</button>
      </div>
      <div id="keyWrapper">
        <div id="answerKeyTable"></div>
        <div id="keyOverlay">
          <button id="revealKeyBtn" type="button">정답 보기</button>
        </div>
      </div>
    </section>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
